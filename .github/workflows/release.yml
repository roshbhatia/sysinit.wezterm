name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake check -L
      - run: nix develop -c uv run --script hack/extra-docs.py --check
      - name: Package adapters
        run: nix develop -c uv run --script hack/release-scripts.py --version "${GITHUB_REF_NAME#v}" --all
      - name: Publish archives
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
